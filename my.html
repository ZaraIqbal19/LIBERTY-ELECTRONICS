<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You - Liberty Electronics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      /* background-color: #000;
      color: #00fff7; */
      font-family: 'Poppins', sans-serif;
    }
    .textglow {
      text-shadow: 0 0 5px #00fff7, 0 0 10px #00fff7, 0 0 20px #00fff7;
    }
    .textborder {
      border: 2px solid #00fff7;
      box-shadow: 0 0 10px #00fff7, 0 0 20px #00fff7;
    }
    .thank-you-box {
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px #00fff7; }
      50% { box-shadow: 0 0 30px #00fff7; }
      100% { box-shadow: 0 0 10px #00fff7; }
    }
    .form-control {
      background-color: #121212;
      border: 1px solid #00fff7;
      color: #00fff7;
    }
    .form-control:focus {
      box-shadow: 0 0 10px #00fff7;
    }
    .modal-content {
      background-color: #121212;
      color: #00fff7;
      border: 2px solid #00fff7;
    }
    .btn-outline-info:hover {
      background-color: #00fff7;
      color: #000;
    }
    .rating-star {
      color: #444;
      cursor: pointer;
      transition: 0.3s;
    }
    .rating-star.glow {
      color: #00fff7;
      text-shadow: 0 0 10px #00fff7;
    }
  </style>
</head>
<body>

  <!-- Thank You Section -->
  <div class="container text-center mt-5">
    <div class="p-5 bg-dark rounded textborder thank-you-box mx-auto w-100 w-md-75 w-lg-50">
      <h1 class="textglow mb-4">🎉 Thank You for Your Order!</h1>
      <p class="mb-4">Your gadgets are getting ready to zoom your way. We appreciate your trust in <strong>Liberty Electronics</strong>.</p>
      <button class="btn btn-outline-info btn-lg" onclick="window.location.href='Collection.html'">🛒 Continue Shopping</button>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content textborder">
        <div class="modal-header border-0">
          <h5 class="modal-title textglow">💬 We Value Your Feedback</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="feedbackForm">

            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="name" placeholder="Your Name">
              <label for="name">Your Name</label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" placeholder="name@example.com">
              <label for="email">Email address</label>
            </div>

            <div class="form-floating mb-3">
              <textarea class="form-control" placeholder="Share your experience" id="experience" style="height: 80px"></textarea>
              <label for="experience">Shopping Experience</label>
            </div>

            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="likedMost" placeholder="What did you like most?">
              <label for="likedMost">What did you like most?</label>
            </div>

            <div class="form-floating mb-3">
              <textarea class="form-control" placeholder="Any suggestions?" id="suggestions" style="height: 80px"></textarea>
              <label for="suggestions">Suggestions</label>
            </div>

            <!-- Star Rating -->
            <div class="mb-4 text-start">
              <label class="form-label textglow">Rate Your Experience:</label><br>
              <div id="starRating">
                <i class="fa-regular fa-star fa-2x rating-star" data-value="1"></i>
                <i class="fa-regular fa-star fa-2x rating-star" data-value="2"></i>
                <i class="fa-regular fa-star fa-2x rating-star" data-value="3"></i>
                <i class="fa-regular fa-star fa-2x rating-star" data-value="4"></i>
                <i class="fa-regular fa-star fa-2x rating-star" data-value="5"></i>
              </div>
              <input type="hidden" id="ratingValue" value="">
            </div>

            <button type="submit" class="btn btn-outline-info w-100 mt-2">✨ Submit Feedback</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    $(document).ready(function () {
      var selectedRating = 0;

      // Show modal after delay
      setTimeout(function () {
        $('#feedbackModal').modal('show');
      }, 4000);

      // Hover effect
      $('.rating-star').hover(function () {
        var value = $(this).data('value');
        $('.rating-star').each(function () {
          if ($(this).data('value') <= value) {
            $(this).addClass('glow');
          } else {
            $(this).removeClass('glow');
          }
        });
      }, function () {
        $('.rating-star').each(function () {
          if ($(this).data('value') <= selectedRating) {
            $(this).addClass('glow');
          } else {
            $(this).removeClass('glow');
          }
        });
      });

      // Click to select rating
      $('.rating-star').click(function () {
        selectedRating = $(this).data('value');
        $('#ratingValue').val(selectedRating);
      });

      // Form submit
      $('#feedbackForm').on('submit', function (e) {
        e.preventDefault();

        var name = $('#name').val().trim();
        var email = $('#email').val().trim();
        var experience = $('#experience').val().trim();
        var liked = $('#likedMost').val().trim();
        var suggestions = $('#suggestions').val().trim();
        var rating = $('#ratingValue').val();

        if (!name || !email || !experience || !liked || !rating) {
          alert('⚠️ Please fill in all required fields and give a rating.');
          return;
        }

        alert('🎉 Thank you for your feedback, ' + name + '! You rated us ' + rating + ' stars.');
        $('#feedbackModal').modal('hide');
        $('#feedbackForm')[0].reset();
        $('.rating-star').removeClass('glow');
        $('#ratingValue').val('');
        selectedRating = 0;
      });
    });
  </script>

</body>
</html>
