<!doctype html>
<html lang="en">

<head>
  <title>Checkout | Liberty Electronics</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }

    .form-control,
    .form-select {
      background-color: #111;
      border: 1px solid #00fff7;
      color: #fff;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: #111;
      color: #00fff7;
      box-shadow: 0 0 10px #00fff7;
      border-color: #00fff7;
    }

    .checkout-card {
      background-color: #111;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0, 255, 247, 0.1);
    }

    .btn-confirm {
      background-color: #00fff7;
      color: #000;
      font-weight: bold;
    }

    .btn-confirm:hover {
      background-color: #fff;
      color: #000;
    }

    .order-summary {
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 8px rgba(0, 255, 247, 0.2);
      margin-top: 20px;
    }

    .order-summary h5 {
      color: #00fff7;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <h2 class="text-center mb-4">🔐 Secure Checkout</h2>
    <div class="row g-4">
      <!-- Form -->
      <div class="col-md-7">
        <div class="checkout-card">
          <h5 class="mb-4">Customer Information</h5>
          <form id="checkoutForm">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required />
            </div>
            <div class="mb-3">
              <label for="emailAddress" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="emailAddress" required />
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Shipping Address</label>
              <input type="text" class="form-control" id="address" required />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-control" id="city" required />
              </div>
              <div class="col-md-6 mb-3">
                <label for="zip" class="form-label">ZIP Code</label>
                <input type="text" class="form-control" id="zip" required />
              </div>
            </div>
            <div class="mb-3">
              <label for="paymentMethod" class="form-label">Payment Method</label>
              <select class="form-select" id="paymentMethod" required>
                <option value="">Select</option>
                <option value="cod">Cash on Delivery</option>
                <option value="card">Credit/Debit Card</option>
                <option value="easypaisa">EasyPaisa</option>
              </select>
            </div>
            <button type="submit" class="btn btn-confirm w-100 py-2 fs-5 mt-2">Confirm Order</button>
          </form>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="col-md-5">
        <div class="order-summary">
          <h5>🧾 Order Summary</h5>
          <ul class="list-group list-group-flush mt-3">
            <li class="list-group-item bg-transparent text-white d-flex justify-content-between">
              <span>Subtotal</span>
              <span>Rs. 7,250</span>
            </li>
            <li class="list-group-item bg-transparent text-white d-flex justify-content-between">
              <span>Shipping</span>
              <span>Free</span>
            </li>
            <li class="list-group-item bg-transparent text-white d-flex justify-content-between fw-bold">
              <span>Total</span>
              <span>Rs. 7,250</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    document.getElementById("checkoutForm").addEventListener("submit", function (e) {
      e.preventDefault();

      // You could validate and store data here
      alert("✅ Order Confirmed! Thank you for shopping with Liberty Electronics.");
      window.location.href = "OrderPlaced.html";
    });
  </script>
</body>

</html>
