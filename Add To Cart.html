<!doctype html>
<html lang="en">
    <head>
        <title>LIBERTY ELECTRONICS</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
          <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

        <style>
        body {
      background-color: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      padding-bottom: 100px;
    }
        .addtocart{
          text-align: center;
            background-color: lightgray;
            color: black;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
      border: 1px solid #ccc;
      margin: 20px auto;
      padding: 20px;
      max-width: 500px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.6s ease;
    }
    .addtocart:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 15px rgba(255, 255, 255, 0.1);
    }
     .defaultmsg
      {
          display: none;
       }
       .shop-now-btn{
        position: fixed;
        bottom: 0;
        width: 100%;
        padding: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      border-radius: 20px;
       }
          .shop-now-btn:hover {
      background: #fff;
      color: #000;
      cursor: pointer;
      transform: scale(1.02);
    }

    </style>
    </head>

    <body>
        <!-- CHECK OUT PAGE -->
         <div class="container">
        <h3 class="text-center">Checkout Page</h3>
        <p class="text-center defaultmsg">😕 Oops! Your cart is currently empty.

</p>
        <div id="parent">
        </div>
    </div>
    <button class="shop-now-btn" onclick="window.location.href='Heartfelt Thanks.html'">🛒 Shop Now</button>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>
<script>
  var list = JSON.parse(localStorage.getItem('Wishlist'));
  console.log(list);
  var parent = document.getElementById('parent');

  if (list != null && list.length > 0) {
    for (var i = 0; i < list.length; i++) {
      var div = document.createElement('div');
      div.className = "addtocart";

      var h3 = document.createElement('h3');
      h3.innerText = list[i].ProductName;

      var img = document.createElement('img');
      img.src = list[i].ProductImage;
      img.height = 100;
      img.width = 100;

      // ✅ Show Quantity
      var quantity = document.createElement('p');
      quantity.innerHTML = `Quantity: <strong>${list[i].Quantity}</strong>`;
      quantity.className = "text-center";

      // ✅ Show Total Price
      var p = document.createElement('p');
      p.innerText = `${list[i].TotalAmount} PKR`;
      p.className = "text-center fw-bold";

      div.append(h3);
      div.append(img);
      div.append(quantity);  // Add quantity display
      div.append(p);
      parent.append(div);
    }
  } else {
    var dm = document.getElementsByClassName('defaultmsg');
    dm[0].style.display = "block";
  }
</script>
