<!doctype html>
<html lang="en">
  <head>
    <title>LIBERTY ELECTRONICS - Checkout</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

    <style>
      /* body {
        font-family: 'Poppins', sans-serif;
        padding-bottom: 140px;
      } */

      .confirm-btn {
        position: fixed;
        bottom: 0;
        right: 0;
        width: 35%;
        padding: 14px;
        font-size: 1.6rem;
        font-weight: 600;
               background-color: #080707;
        color: hwb(0 94% 6%);
        box-shadow: 0 0 15px #fff;
      }
      .confirm-btn:hover {
         box-shadow: 0 0 10px #00fff7, 0 0 20px #00fff7;
        background-color: #00fff7;
        color: #000;
      }
      .removeicon {
        position: absolute;
        top: 10px;
        right: 15px;
        cursor: pointer;
        font-size: 30px;
        color: red;
      }
      .cartcard {
        width: 60%;
        margin: 0 auto 20px auto;
        background-color: #121212;
        color: #fff;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 0 15px rgba(0, 255, 247, 0.3);
        position: relative;
        transition: 0.3s ease-in-out;
      }
      .cartcard:hover {
        box-shadow: 0 0 25px rgba(0, 255, 247, 0.6);
        transform: scale(1.01);
      }
      .addsubbtn {
        border: 2px solid #00fff7;
        color: #00fff7;
        background: transparent;
        transition: all 0.3s ease-in-out;
      }
      .addsubbtn:hover {
        background-color: #00fff7;
        color: #000;
        box-shadow: 0 0 10px #00fff7;
      }
       .proimg{
    height: 150px;
  object-fit: contain;
  filter: brightness(1.3) drop-shadow(0 0 4px #070909);
  transition: transform 0.4s ease, filter 0.4s ease;
  padding: 10px;
  margin: auto;
}
.proimg:hover{
    transform: scale(1.05);
  filter: brightness(1.6) drop-shadow(0 0 20px #0a0a0a);
}
      .modal-content {
        background-color: #1c1c1c;
      }
      .toast-body {
        font-weight: 500;
      }
    </style>
  </head>

  <body class="bg-black text-white">
    <div class="container text-center">
      <h3 class="my-4">✨🛒 Your Cart’s Loaded — Time to Ignite the Checkout! 🔥🚀</h3>
      <p class="defaultmsg">😕 Oops! Your cart is currently empty.</p>
      <p id="totalItems" class="fw-semibold fs-5 mb-4"></p>
      <div id="parent"></div>
      <h5 id="grandTotal" class="text-info fw-bold mt-4"></h5>
    </div>
    <button class="confirm-btn" onclick="confirmOrder()">✅ Confirm Order</button>
    <!-- Toast for item removal -->
    <div class="position-fixed top-10 end-0 p-3" style="z-index: 11">
      <div id="deleteToast" class="toast align-items-center text-bg-danger border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body">🗑️ Item removed from your cart.</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>
    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-white">
          <div class="modal-header">
            <h5 class="modal-title">⚠️ Delete This Product?</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to remove this item from your cart?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn addsubbtn" data-bs-dismiss="modal">No</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Yes, Remove</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
var list = JSON.parse(localStorage.getItem('Wishlist')) || [];
var parent = document.getElementById('parent');
var totalItems = document.getElementById('totalItems');
var grandTotalElem = document.getElementById('grandTotal');
var toastElement = new bootstrap.Toast(document.getElementById('deleteToast'));
var confirmDeleteModal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
var deleteIndex = null;
function VisualizeCartItems() {
  parent.innerHTML = '';
  var count = 0;
  var grandTotal = 0;
  if (list.length > 0) {
    document.querySelector('.defaultmsg').style.display = 'none';
    list.forEach(function (item, index) {
      count += item.Quantity;
      grandTotal += item.TotalAmount;
      var div = document.createElement('div');
      div.className = "cartcard";
      div.innerHTML = `
        <span class="removeicon" onclick="askDelete(${index})">&times;</span>
        <h5>${item.ProductName}</h5>
        <img src="${item.ProductImage}" class="img-fluid my-3 proimg" />
        <div class="d-flex justify-content-center align-items-center gap-3 my-2">
          <button class="btn btn-sm addsubbtn" onclick="decrement(${index})">-</button>
          <span class="fw-semibold">Quantity: ${item.Quantity}</span>
          <button class="btn btn-sm addsubbtn" onclick="increment(${index})">+</button>
        </div>
        <p class="fw-bold mb-1">Total: ${item.TotalAmount} PKR</p>
      `;
      parent.appendChild(div);
    });
    totalItems.innerText = `🛒 Total Products: ${count}`;
    grandTotalElem.innerText = `💵 Grand Total: ${grandTotal} PKR`;
  } else {
    document.querySelector('.defaultmsg').style.display = 'block';
    totalItems.innerText = '';
    grandTotalElem.innerText = '';
  }
}
function increment(index) {
  list[index].Quantity += 1;
  list[index].TotalAmount = list[index].ProductPrice * list[index].Quantity;
  localStorage.setItem('Wishlist', JSON.stringify(list));
  VisualizeCartItems();
}
function decrement(index) {
  if (list[index].Quantity > 1) {
    list[index].Quantity -= 1;
    list[index].TotalAmount = list[index].ProductPrice * list[index].Quantity;
  } else {
    askDelete(index);
    return;
  }
  localStorage.setItem('Wishlist', JSON.stringify(list));
  VisualizeCartItems();
}
function askDelete(index) {
  deleteIndex = index;
  confirmDeleteModal.show();
}
document.getElementById('confirmDeleteBtn').addEventListener('click', function () {
  if (deleteIndex != null) {
    list.splice(deleteIndex, 1);
    localStorage.setItem('Wishlist', JSON.stringify(list));
    VisualizeCartItems();
    toastElement.show();
    deleteIndex = null;
    confirmDeleteModal.hide();
  }
});
function confirmOrder() {
  if (list.length == 0) {
    alert("Your cart is empty!");
    return;
  }
  alert("🎉 Order Confirmed! Thank you for shopping.");
  localStorage.removeItem('Wishlist');
  window.location.reload();
}
VisualizeCartItems();
    </script>
  </body>
</html>
