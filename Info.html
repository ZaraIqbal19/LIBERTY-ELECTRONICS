<!doctype html>
<html lang="en">
<head>
  <title>Product Detail</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #080707;
      font-family: 'Poppins', sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      animation: fadeInBody 1s ease-in-out;
    }
    @keyframes fadeInBody {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .info-card {
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 15px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
      text-align: center;
      animation: fadeInCard 0.8s ease-in-out;
    }
    @keyframes fadeInCard {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .product-img {
      width: 100%;
      border-radius: 10px;
      max-height: 250px;
      object-fit: contain;
      transition: transform 0.3s ease;
    }
    .product-img:hover {
      transform: scale(1.03);
    }
    h3 {
      font-weight: 450;
      margin-top: 20px;
      color: #000;
    }
    p {
      color: #555;
    }
    .btn-dark{
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 500;
      width: 48%;
      transition: all 0.3s ease;
    }
    .btn-dark:hover{
      transform: scale(1.05);
      opacity: 0.9;
    }

    .form-control {
      background-color: #e6e6e6;
      text-align: center;
      transition: box-shadow 0.3s ease;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(0, 0, 0, 0.15);
    }
    .form-label {
      font-weight: 500;
      color: #484646;
    }
    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="info-card">
    <img src="" class="product-img mb-4" id="ProductImage" alt="">

    <h3 id="ProductName">Product Name</h3>
    <p id="ProductDescription">Product Description</p>
    <p id="Specs">Specifications</p>
    <p>Price: <b id="ProductPrice" class="text-black fw-bold">0</b> PKR</p>

    <div class="mb-3">
      <label for="quantity" class="form-label">Quantity</label>
      <input type="number" id="quantity" value="1" class="form-control w-50 mx-auto">
    </div>

    <div class="button-group">
      <button onclick="generatebill()" class="btn btn-dark">Add to Cart</button>
      <button class="btn btn-dark" onclick="window.location.href='Add To Cart.html'">Check Out</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    var Info = JSON.parse(localStorage.getItem('Info'));
    if (Info) {
      $('#ProductName').text(Info.ProductName);
      $('#ProductPrice').text(Info.ProductPrice);
      $('#ProductDescription').text(Info.ProductDescription);
      $('#Specs').text(Info.Specifications);
      $('#ProductImage').attr('src', Info.ProductImage);
      $('#ProductImage').attr('alt', Info.ProductName);
    }

    var list = JSON.parse(localStorage.getItem('Wishlist')) || [];

    function generatebill() {
      var q = parseInt($('#quantity').val());
      if (q < 1 || isNaN(q)) {
        alert("Please enter a valid quantity.");
        return;
      }
      var total = Info.ProductPrice * q;
      var group = {
        "ProductName": Info.ProductName,
        "ProductImage": Info.ProductImage,
        "TotalAmount": total
      };
      list.push(group);
      alert('Your total amount for this product is ' + total + ' PKR');
      localStorage.setItem('Wishlist', JSON.stringify(list));
    }
  </script>
</body>
</html>
