<!doctype html>
<html lang="en">
<head>
  <title>LIBERTY ELECTRONICS</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .checkout-card {
      background-color: #111;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0, 255, 247, 0.1);
    }
    .btn-confirm {
      background-color: #00fff7;
      color: #000;
      font-weight: bold;
    }
    .btn-confirm:hover {
      background-color: #fff;
      color: #000;
    }
    .order-summary {
      background-color: #1b1b1b;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 8px rgba(0, 255, 247, 0.2);
      margin-top: 20px;
      color: white;
    }
    .order-summary h5 {
      color: #00fff7;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="text-center mb-4">🔐 Checkout with Confidence, Powered by Liberty Electronics</h2>
    <div class="row g-4">
      <!-- Form -->
      <div class="col-md-7">
        <div class="checkout-card">
          <h5 class="mb-4">Customer Information</h5>
          <form id="checkoutForm">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required />
            </div>
            <div class="mb-3">
              <label for="emailAddress" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="emailAddress" required />
            </div>
            <div class="mb-3">
              <label for="contactNumber" class="form-label">Contact Number</label>
              <input type="text" class="form-control" id="contactNumber" required />
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Shipping Address</label>
              <input type="text" class="form-control" id="address" required />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-control" id="city" required />
              </div>
              <div class="col-md-6 mb-3">
                <label for="zip" class="form-label">ZIP Code</label>
                <input type="text" class="form-control" id="zip" required />
              </div>
            </div>
            <button type="submit" class="btn btn-confirm w-100 py-2 fs-5 mt-2">Order Dispatched</button>
          </form>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="col-md-5">
        <div class="order-summary">
          <h5>📟 Order Summary</h5>
          <div id="orderDetails" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    function calculateSummary() {
      var grandTotal = parseFloat(localStorage.getItem("GrandTotal")) || 0;
      var gst = +(grandTotal * 0.015).toFixed(2);
      var finalAmount = grandTotal + gst;

      var list = JSON.parse(localStorage.getItem("Wishlist")) || [];

      var html = "";
      $.each(list, function (i, item) {
        html += `
          <li class="list-group-item bg-transparent text-white">
            <div class="d-flex justify-content-between">
              <span><strong>${item.ProductName}</strong> x ${item.quantity || 1}</span>
              <span>Rs. ${item.TotalAmount || item.ProductPrice}</span>
            </div>
          </li>`;
      });

      html += `
        <li class="list-group-item bg-transparent d-flex justify-content-between text-white">
          <span>Billing Amount</span><span>Rs. ${grandTotal}</span>
        </li>
        <li class="list-group-item bg-transparent d-flex justify-content-between text-white">
          <span>Shipping</span><span>Free</span>
        </li>
        <li class="list-group-item bg-transparent d-flex justify-content-between text-white">
          <span>GST (1.5%)</span><span>Rs. ${gst}</span>
        </li>
        <li class="list-group-item bg-transparent d-flex justify-content-between fw-bold text-white">
          <span>Total Amount</span><span>Rs. ${finalAmount.toFixed(2)}</span>
        </li>`;

      $("#orderDetails").html(`<ul class="list-group list-group-flush">${html}</ul>`);
    }

    $(document).ready(function () {
      calculateSummary();

      $("#checkoutForm").submit(function (e) {
        e.preventDefault();

        var name = $("#fullName").val();
        var contact = $("#contactNumber").val();
        var address = $("#address").val();
        var city = $("#city").val();
        var zip = $("#zip").val();

        var orderInfo = {
          name: name,
          contact: contact,
          address: address + ", " + city + " - " + zip,
          total: localStorage.getItem("GrandTotal")
        };

        localStorage.setItem("OrderInfo", JSON.stringify(orderInfo));

        setTimeout(function () {
          window.location.href = "HeartFelt Thanks.html";
        }, 300);
      });
    });
  </script>
</body>
</html>
